plugins { id 'com.android.application' }

def signingFile = rootProject.file('signing.properties')
def releaseSigning = new Properties()
if (signingFile.exists()) signingFile.withInputStream { releaseSigning.load(it) }

android {
    namespace 'com.aperoroyale'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aperoroyale'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
